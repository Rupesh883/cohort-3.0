<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Goals</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <main>
            <nav class="border-b-2 ">
            <a  href="../../index.html" class=" backbtn "><i class="ri-arrow-left-double-line"></i></a>
            <h2>Daily Goals</h2>
       </nav>
 <section>
    <div class="progress-card">
        <div class="progress-text"><sapn class="completedGoals">3</sapn> of <sapn class="totalGoals">5</sapn> completed</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="goals-grid">

        <div class="goal-item add-goal">
            <i class="ri-add-line"></i>
            <span>Add a new goal</span>
        </div>
    </div>
    <!-- input form  -->
       <div class="goalinputcover">
            <div class="goalsinputcard">
       <h3><i class="ri-target-fill"></i> Enter Your goal</h3>
         <input type="text" class="goalinput">
         <button class="addgoalsbtn">Add</button>
    </div>
       </div>
</section>
    </main>
 <script src="script.js"></script>   
</body>
</html>
