<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
        <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <main>
        <nav class="border-b-2 ">
            <a  href="../../index.html" class=" backbtn "><i class="ri-arrow-left-double-line"></i></a>
            <h2>Pomodoro Timer</h2>
       </nav>
                    <section>
                        <button class="toglebtn">Pomodoro Timer</button>
                        <h1 class="timer"><span class="munites">25</span>:<span class="second">00</span> </h1>
                        <div class="btns">
                            <button class="start">Start</button>
                            <button class="stop">Stop</button>
                            <button class="reset">Reset</button>
                        </div>
                </section>
    </main>
    <script src="script.js"></script>
</body>
