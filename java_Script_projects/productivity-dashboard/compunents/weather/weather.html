<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <main>
            <nav class="border-b-2 ">
            <a  href="../../index.html" class=" backbtn "><i class="ri-arrow-left-double-line"></i></a>
            <h2>Weather</h2>
       </nav>
<section>
    <div class="weather-main">
        <div>
            <div class="location"><i class="ri-map-pin-fill"></i> <h3 class="location">New Delhi</h3> </div>
            <div class="icon-big"><img src="" class="bigicon" alt=""></div>
        </div>
        <div class="temp-block">
            <div class="temp">31°</div>
            <div class="condition">Sunny</div>
        </div>
    </div>

    <div class="detail-grid">
        <div class="detail-tile">
            <i class="ri-drop-fill"></i>
            <div class="Humidityvalue">42%</div>
            <div class="label">Humidity</div>
        </div>
        <div class="detail-tile">
            <i class="ri-windy-fill"></i>
            <div class="windvalue">14 km/h</div>
            <div class="label">Wind</div>
        </div>
        <div class="detail-tile">
            <i class="ri-thermometer-fill"></i>
            <div class="Feelsvalue">34°</div>
            <div class="label">Feels like</div>
        </div>
        <div class="detail-tile">
            <i class="ri-sun-cloudy-fill"></i>
            <div class="UVvalue">UV 6</div>
            <div class="label">UV Index</div>
        </div>
    </div>
</section>
    </main>
 <script src="script.js"></script>   
</body>
</html>
