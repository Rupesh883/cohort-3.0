<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature-Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
     <section>
        <h1>Temperature-Converter</h1>
        <div class="fromcontainer">
          <div class="texts">
            <h1>Celsius:</h1>
            <h1>Fahrenheit:</h1>
            <h1>Kelvin:</h1>
          </div>
          <div class="inputs">
              <input type="number" class="Celsius" placeholder="inter Temperature">
              <input type="number" class="Fahrenheit" placeholder="inter Temperature">
              <input type="number" class="Kelvin" placeholder="inter Temperature">
          </div>
        </div>
     </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
